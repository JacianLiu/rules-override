[Remote Rule]
# ============================================================
# 远程规则集
# 规则来源说明：
#   - MetaCubeX .mrs 格式（二进制）Loon 不支持，已替换为：
#     * Loyalsoldier/clash-rules（国内/国外 IP、域名分流）
#     * blackmatrix7/ios_rule_script Loon 专版（AI、广告等）
#   - 自维护补充规则沿用原仓库 list 格式，type=domain-set
# ============================================================

# 广告拦截（对应 category-ads-all）
