    empty-fallback: DIRECT
    icon: "https://testingcf.jsdelivr.net/gh/Vbaethon/HOMOMIX@main/Icon/Color/Microsoft.png"

  - name: "🍎 苹果服务"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"
      - REJECT
      - "🇺🇸 美国"
      - "🇭🇰 香港"
      - "🇸🇬 新加坡"
      - "🏠 家宽节点"
      - "🇯🇵 日本"
      - "🌐 其他"
      - "🎯 中转节点"
