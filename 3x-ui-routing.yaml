  - name: "🏠 私有网络"
    type: select
    proxies:
      - DIRECT
      - REJECT
      - "🇺🇸 美国"
      - "🇭🇰 香港"
      - "🇸🇬 新加坡"
      - "🏠 家宽节点"
      - "🇯🇵 日本"
      - "🌐 其他"
      - "🎯 中转节点"
      - "🚀 节点选择"
    include-all: true
    exclude-type: direct
    empty-fallback: DIRECT
    icon: "https://testingcf.jsdelivr.net/gh/Vbaethon/HOMOMIX@main/Icon/Color/Home.png"

  - name: "🔒 国内服务"
    type: select
    proxies:
      - DIRECT
      - REJECT
      - "🇺🇸 美国"
      - "🇭🇰 香港"
      - "🇸🇬 新加坡"
      - "🏠 家宽节点"
      - "🇯🇵 日本"
      - "🌐 其他"
      - "🎯 中转节点"
      - "🚀 节点选择"
