  - name: "Ⓜ️ 微软服务"
    type: select
    proxies:
      - "🚀 节点选择"
      - DIRECT
      - REJECT
      - "🇺🇸 美国"
      - "🇭🇰 香港"
      - "🇸🇬 新加坡"
      - "🏠 家宽节点"
      - "🇯🇵 日本"
      - "🌐 其他"
      - "🎯 中转节点"
    include-all: true
